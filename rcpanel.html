<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>RC Panel - Submit Request</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#0f172a,#020617);color:#fff;min-height:100vh}
  .back-bar{padding:12px 16px 0}
  .back-btn{display:inline-block;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);padding:8px 16px;border-radius:40px;color:#4ade80;text-decoration:none;font-size:13px;transition:.2s}
  .back-btn:hover{background:rgba(74,222,128,.15);border-color:#4ade80}
  .form-container{position:relative;overflow:auto;width:100%;max-width:640px;margin:0 auto;padding:16px;-webkit-overflow-scrolling:touch}
  .form-container iframe{width:100%;height:100%;min-height:700px;border:0;border-radius:20px;background:rgba(255,255,255,.02)}
  @media (max-width:640px){.form-container iframe{min-height:75vh}}
</style>
</head>
<body>
<div class="back-bar">
  <a href="dashboard.html" class="back-btn">← Back to Dashboard</a>
</div>
<div class="form-container">
  <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfCTn1GtIAIcABIauRoTfHfjCOpEtlXTyUzi1k0aKIAyL3OJA/viewform?embedded=true" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
</div>
</body>
</html>
